name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - run: ./scripts/build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cc-router-alpha-binaries
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
